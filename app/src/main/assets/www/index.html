function initialState(){
  return {
    schema:SCHEMA,version:VERSION,createdAt:now(),updatedAt:now(),
    plan:deepClone(DEFAULT_PLAN),
    sessions:[],activeSessionId:null,
    weightHistory:[],plannedAbsences:[],planHistory:[],planBackups:[],
    profile:{name:'',goalWeight:70},
    settings:{sounds:true,selectedDay:weekdayToPlan(new Date()),view:'workout',calendarMonth:isoDate(new Date()).slice(0,7)},
    restTimer:null,
    ui:{expandedExerciseId:null,selectedHistoryDate:isoDate(new Date()),localPreviewAccepted:false}
  };
}

let state = loadState();
// A app abre sempre no treino do dia. Uma sessão interrompida é oferecida para retomar, nunca forçada.
state.settings.view='workout';
state.settings.selectedDay=weekdayToPlan(new Date());
let currentSessionId = null;
let saveTimer = null;
let snapshotTimer = null;
let restInterval = null;
let wakeLock = null;
let audioCtx = null;
let dragInfo = null;

function loadState(){
  let s = safeJSON(localStorage.getItem(KEY));
  if(!s || typeof s!=='object' || s.schema!==SCHEMA) s=null;
  for(let i=0;i<SNAP_COUNT;i++){
    const cand=safeJSON(localStorage.getItem(SNAP_PREFIX+i));
    if(cand?.schema===SCHEMA) s=newerState(s,cand);
  }
  s=newerState(s,nativeState());
  if(!s){
    const migrated=migrateV6();
    if(migrated)return migrated;
    return initialState();
  }
  return normalizeState(s);
}
function normalizeState(s){
  const base=initialState();
  s.schema=SCHEMA;s.version=VERSION;
  s.plan=s.plan?.days? s.plan : base.plan;
  s.sessions=Array.isArray(s.sessions)?s.sessions:[];
  s.weightHistory=Array.isArray(s.weightHistory)?s.weightHistory:[];
  s.plannedAbsences=Array.isArray(s.plannedAbsences)?s.plannedAbsences:[];
  s.planHistory=Array.isArray(s.planHistory)?s.planHistory:[];
  s.planBackups=Array.isArray(s.planBackups)?s.planBackups:[];
  s.profile={...base.profile,...(s.profile||{})};
  s.settings={...base.settings,...(s.settings||{})};
  s.ui={...base.ui,...(s.ui||{})};
  if(!DAYS.includes(s.settings.selectedDay))s.settings.selectedDay=weekdayToPlan(new Date());
  return s;
}
function migrateV6(){
  try{
    const oldPlan=safeJSON(localStorage.getItem('hp5_plan'));
    const oldLogs=safeJSON(localStorage.getItem('hp5_logs'));
    const oldWeight=safeJSON(localStorage.getItem('hp5_weight_history'));
    if(!oldPlan && !oldLogs && !oldWeight) return null;
    const s=initialState();
    if(Array.isArray(oldWeight)) s.weightHistory=oldWeight.map(w=>({id:w.id||uid('w'),date:w.date||isoDate(),weight:Number(w.weight)||0})).filter(w=>w.weight>0);
    // O plano v7 é mantido por segurança; os registos antigos entram como sessões legadas agrupadas.
    if(Array.isArray(oldLogs) && oldLogs.length){
      const groups=new Map();
      for(const l of oldLogs){
        const date=l.date||isoDate(); const day=l.day||weekdayToPlan(dateFromISO(date)); const k=`${date}|${day}`;
        if(!groups.has(k)) groups.set(k,{id:uid('legacy'),date,day,status:'completed',startedAt:dateFromISO(date).getTime(),endedAt:dateFromISO(date).getTime(),legacy:true,exercises:[],planRevision:'legacy'});
        groups.get(k).exercises.push({exerciseId:l.exerciseId||uid('legacy-ex'),name:l.exerciseName||l.exName||'Exercício antigo',status:l.status||'completed',generalNote:l.obs||'',sets:[]});
      }
      s.sessions=[...groups.values()];
    }
    toastLater('Dados antigos encontrados e migrados para a v7.');
    return s;
  }catch{return null;}
}
function persist(immediate=false){
  const doSave=()=>{
    try{
      state.updatedAt=now();
      localStorage.setItem(KEY,JSON.stringify(state));
      setSave('saved','✓ Guardado');
      mirrorIndexedDB();
      if(window.NativeBridge?.saveSnapshot){try{window.NativeBridge.saveSnapshot(JSON.stringify(state));}catch{}}
    }catch(e){ console.error(e); setSave('error','⚠ Erro ao guardar'); }
  };
  setSave('saving','A guardar…');
  clearTimeout(saveTimer);
  if(immediate) doSave(); else saveTimer=setTimeout(doSave,40);
  clearTimeout(snapshotTimer);
  snapshotTimer=setTimeout(rotateSnapshot,1200);
}
function rotateSnapshot(){
  try{
    for(let i=SNAP_COUNT-1;i>0;i--){ const prev=localStorage.getItem(SNAP_PREFIX+(i-1)); if(prev)localStorage.setItem(SNAP_PREFIX+i,prev); }
    localStorage.setItem(SNAP_PREFIX+'0',JSON.stringify(state));
  }catch{}
}
function mirrorIndexedDB(){
  if(!('indexedDB' in window)) return;
  try{
    const req=indexedDB.open('hipertrofia-pro-v7',1);
    req.onupgradeneeded=()=>{ if(!req.result.objectStoreNames.contains('state'))req.result.createObjectStore('state'); };
    req.onsuccess=()=>{ const tx=req.result.transaction('state','readwrite'); tx.objectStore('state').put(state,'main'); };
  }catch{}
}
function recoverIndexedDBIfNewer(){
  if(!('indexedDB' in window))return;
  try{
    const req=indexedDB.open('hipertrofia-pro-v7',1);
    req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('state'))req.result.createObjectStore('state');};
    req.onsuccess=()=>{
      try{
        const tx=req.result.transaction('state','readonly'),get=tx.objectStore('state').get('main');
        get.onsuccess=()=>{const cand=get.result;if(cand?.schema===SCHEMA&&Number(cand.updatedAt||0)>Number(state.updatedAt||0)){state=normalizeState(cand);persist(true);render();toast('Dados recuperados da cópia local de segurança.');}};
      }catch{}
    };
  }catch{}
}
function setSave(cls,text){const el=document.getElementById('save-indicator');if(!el)return;el.className=`save-indicator ${cls}`;el.textContent=text;}
function toastLater(t){setTimeout(()=>toast(t),500)}
function toast(text){
  const root=document.getElementById('toast-root');if(!root)return;
  const d=document.createElement('div');d.className='toast';d.textContent=text;root.appendChild(d);setTimeout(()=>d.remove(),2800);
}

function fmtTarget(ex){
  const load=fmtLoad(ex.targetWeight,ex.loadMode,true);
  const reps=ex.targetReps||'reps livres';
  return `${load} · ${reps} · ${ex.sets} séries`;
}
function fmtLoad(weight,mode,target=false){
  const w=String(weight??'').trim();
  if(mode==='bodyweight') return 'Peso corporal';
  if(!w) return target?'Carga a definir':'—';
  const n=parseNumber(w);
  if(n!==null && ['perSide','twoDumbbells'].includes(mode)) return `${displayNum(n)}+${displayNum(n)} kg`;
  if(n!==null) return `${displayNum(n)} kg`;
  return w;
}
function displayNum(n){return Number.isInteger(n)?String(n):String(n).replace('.',',');}
function numericTotalLoad(weight,mode,unilateral=false){
  const n=parseNumber(weight);if(n===null)return 0;
  if(mode==='perSide'||mode==='twoDumbbells')return n*2;
  if(unilateral)return n*2;
  return n;
}
function parseRepRange(s){const m=String(s||'').match(/(\d+)\D+(\d+)/);return m?{min:+m[1],max:+m[2]}:null;}
function planDay(day){return state.plan.days[day];}
function activePlanExercises(day){return (planDay(day)?.exercises||[]).filter(e=>e.active!==false);}
function getSession(id){return state.sessions.find(s=>s.id===id)||null;}
function activeSession(){return currentSessionId?getSession(currentSessionId):null;}
function sessionsForDate(date){return state.sessions.filter(s=>s.date===date).sort((a,b)=>(a.startedAt||0)-(b.startedAt||0));}
function lastSessionsForExercise(exerciseId,beforeDate=null,limit=3){
  return state.sessions.filter(s=>s.status==='completed' || s.status==='incomplete').filter(s=>!beforeDate||s.date<beforeDate).sort((a,b)=>(b.startedAt||0)-(a.startedAt||0)).flatMap(s=>{
    const e=s.exercises?.find(x=>x.exerciseId===exerciseId);return e?[{session:s,exercise:e}]:[];
  }).slice(0,limit);
}

function makeSessionExercise(ex){
  const sets=[]; let idx=1;
  const wc=Number(ex.warmup?.sets||0);
  for(let i=0;i<wc;i++)sets.push(makeSet('warmup',i+1,ex.warmup?.weight||'',ex.warmup?.reps||'',Number(ex.warmup?.rest??ex.rest),ex));
  for(let i=0;i<Number(ex.sets||0);i++)sets.push(makeSet('work',i+1,ex.targetWeight||'',ex.targetReps||'',ex.rest,ex));
  return {exerciseId:ex.id,name:ex.name,status:'pending',skipReason:'',generalNote:'',sets,unilateral:!!ex.unilateral,loadMode:ex.loadMode,execution:ex.execution,progression:ex.progression,planNotes:ex.notes,targetWeight:ex.targetWeight,targetReps:ex.targetReps,rest:ex.rest,order:idx};
}
function makeSet(type,index,targetWeight,targetReps,targetRest,ex){
  return {id:uid('set'),type,index,targetWeight,targetReps,targetRest,weight:'',reps:'',repsLeft:'',repsRight:'',done:false,note:'',completedAt:null,restStartedAt:null,restEndedAt:null,restEndSource:null};
}
function createSession(day){
  const pd=planDay(day); if(!pd)return null;
  const s={id:uid('session'),date:isoDate(),day,title:pd.title,focus:pd.focus,status:'active',startedAt:now(),endedAt:null,planRevision:state.plan.revision,sessionNote:'',exercises:activePlanExercises(day).map(makeSessionExercise),manualPlanChangesAtStart:unpatchedManualChanges(),editedAfterFinish:false};
  state.sessions.push(s);state.activeSessionId=s.id;currentSessionId=s.id;state.ui.expandedExerciseId=s.exercises[0]?.exerciseId||null;persist(true);requestWakeLock();return s;
}
function unpatchedManualChanges(){return state.planHistory.filter(x=>x.source==='manual'&&!x.acknowledgedByPatch).map(x=>({at:x.at,label:x.label}));}

function render(){
  const view=state.settings.view||'workout';
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.view===view));
  const titles={workout:'Treino',history:'Histórico',progress:'Progresso',more:'Mais'};
  document.getElementById('view-title').textContent=titles[view]||'Hipertrofia Pro';
  if(view==='workout')renderWorkout();
  if(view==='history')renderHistory();
  if(view==='progress')renderProgress();
  if(view==='more')renderMore();
  renderRestDock();
}

function renderWorkout(){
  const root=document.getElementById('main-content');
  const s=activeSession();
  if(s){root.innerHTML=workoutSessionHTML(s);bindWorkoutSession(s);return;}
  const day=state.settings.selectedDay;
  const pd=planDay(day);
  const unfinished=state.sessions.filter(x=>x.status==='active').sort((a,b)=>(b.startedAt||0)-(a.startedAt||0))[0];
  const weightReminder=needsWeightReminder();
  root.innerHTML=`
    ${unfinished?`<div class="banner warning"><div><strong>Tens um treino por terminar</strong><div class="tiny muted">${esc(unfinished.day)} · ${fmtDate(unfinished.date)}</div></div><div class="actions"><button class="secondary" id="continue-session">Continuar</button><button class="ghost" id="close-old">Encerrar</button></div></div>`:''}
    ${weightReminder?`<div class="banner"><div><strong>Registo semanal de peso</strong><div class="tiny muted">Está na altura de actualizar o peso corporal.</div></div><button class="secondary" id="weight-reminder-btn">Registar</button></div>`:''}
    <div class="day-switcher">${DAYS.map(d=>`<button class="day-btn ${d===day?'active':''}" data-day="${d}">${d.slice(0,3)}</button>`).join('')}</div>
    <section class="hero">
      <div class="hero-row"><div><div class="eyebrow">${esc(day.toUpperCase())}</div><h2>${esc(pd.title)}</h2><p>${esc(pd.focus)}</p></div><div class="hero-badge">${activePlanExercises(day).length} exercícios</div></div>
    </section>
    <div class="card">
      <h3 class="card-title">Plano de hoje</h3>
      <div class="preview-list">${activePlanExercises(day).map((e,i)=>previewItemHTML(e,i)).join('')}</div>
      <button id="start-workout" class="primary" style="width:100%;margin-top:8px">Iniciar treino</button>
    </div>`;
  root.querySelectorAll('.day-btn').forEach(b=>b.onclick=()=>{state.settings.selectedDay=b.dataset.day;persist();render();});
  root.querySelectorAll('.preview-item').forEach(el=>el.onclick=()=>togglePreviewDetails(el));
  root.querySelector('#start-workout').onclick=()=>{
    if(unfinished){openConfirm('Existe um treino por terminar','Para iniciar outro treino, o anterior será encerrado como incompleto, mantendo tudo o que já registaste.',()=>{unfinished.status='incomplete';unfinished.endedAt=now();if(state.activeSessionId===unfinished.id)state.activeSessionId=null;if(state.restTimer?.sessionId===unfinished.id)state.restTimer=null;createSession(day);haptic(25);render();});return;}
    createSession(day);haptic(25);render();
  };
  if(unfinished){
    root.querySelector('#continue-session').onclick=()=>{state.activeSessionId=unfinished.id;currentSessionId=unfinished.id;state.ui.expandedExerciseId=nextPendingExercise(unfinished)?.exerciseId||unfinished.exercises[0]?.exerciseId;persist(true);requestWakeLock();render();};
    root.querySelector('#close-old').onclick=()=>openCloseOldModal(unfinished);
  }
  if(weightReminder)root.querySelector('#weight-reminder-btn').onclick=openWeightModal;
}

function workoutSessionHTML(s){

function fmtSessionTarget(e){return `${fmtLoad(e.targetWeight,e.loadMode,true)} · ${e.targetReps||'reps livres'} · ${e.sets.filter(s=>s.type==='work').length} séries`;}
function setRowHTML(e,set,si){

function startSessionClock(s){
  const el=document.getElementById('session-clock'); if(!el)return;
  const tick=()=>{if(!document.body.contains(el))return;el.textContent=formatDuration(now()-(s.startedAt||now()));setTimeout(tick,1000);}; tick();
}
function formatDuration(ms){const sec=Math.max(0,Math.floor(ms/1000));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${m}:${String(s).padStart(2,'0')}`;}
function exerciseBySet(s,setId){return s.exercises.find(e=>e.sets.some(x=>x.id===setId));}
function validateSet(e,set){
  if(e.loadMode!=='bodyweight' && !String(set.weight||'').trim())return 'Introduz a carga usada.';
  if(e.unilateral){
    if(!String(set.repsLeft||'').trim()||!String(set.repsRight||'').trim())return 'Regista as reps dos dois lados.';
    if(String(set.repsLeft)!==String(set.repsRight))return 'Os dois lados devem ficar com o mesmo número de repetições.';
  }else if(!String(set.reps||'').trim())return 'Introduz as repetições.';
  return '';
}
function toggleSet(s,setId){
  const e=exerciseBySet(s,setId);const set=e?.sets.find(x=>x.id===setId);if(!set)return;
  if(set.done){
    set.done=false;set.completedAt=null;
    if(state.restTimer?.setId===set.id)stopRest('undo',true);
    e.status='pending';state.ui.expandedExerciseId=e.exerciseId;haptic(16);persist(true);render();return;
  }
  const setIndex=e.sets.indexOf(set);
  if(e.sets.slice(0,setIndex).some(x=>!x.done)){toast('Conclui primeiro o aquecimento/série anterior.');return;}
  const err=validateSet(e,set);if(err){toast(err);return;}
  if(state.restTimer && state.restTimer.setId!==set.id) stopRest('next-set-completed',true);
  if(largeWeightDeviation(e,set) && !set.deviationConfirmed){
    openConfirm('Confirmar carga',`Registaste ${fmtLoad(set.weight,e.loadMode)} mas o alvo é ${fmtLoad(set.targetWeight,e.loadMode,true)}. Confirmas que está correcto?`,()=>{set.deviationConfirmed=true;persist(true);toggleSet(s,setId);});return;
  }
  set.done=true;set.completedAt=now();haptic(28);playSound('set');
  const allDone=e.sets.every(x=>x.done);
  if(allDone){e.status='completed';setTimeout(()=>{},0);}
  const next=nextSetAfter(s,e,set);
  if(next){startRest(s,e,set);}
  else {stopRest('workout-end',true);playSound('finish');}
  if(allDone){
    const nxt=nextPendingExercise(s,e.exerciseId); state.ui.expandedExerciseId=nxt?.exerciseId||e.exerciseId;
  }
  persist(true);render();
  if(allDone && !nextPendingExercise(s)) toast('Último exercício concluído — podes terminar o treino.');
}
function largeWeightDeviation(e,set){
  const a=parseNumber(set.weight),t=parseNumber(set.targetWeight); if(a===null||t===null||t===0)return false;
  return Math.abs(a-t)/t>=0.28;
}
function nextSetAfter(s,e,set){
  const ei=s.exercises.indexOf(e),si=e.sets.indexOf(set);
  if(si<e.sets.length-1)return {exercise:e,set:e.sets[si+1]};
  for(let i=ei+1;i<s.exercises.length;i++){const x=s.exercises[i];if(x.status!=='skipped'&&x.status!=='completed'&&x.sets.some(z=>!z.done))return {exercise:x,set:x.sets.find(z=>!z.done)};}
  for(let i=0;i<s.exercises.length;i++){const x=s.exercises[i];if(x.status==='deferred'&&x.sets.some(z=>!z.done))return {exercise:x,set:x.sets.find(z=>!z.done)};}
  return null;
}
function nextPendingExercise(s,afterId=null){
  const start=afterId?Math.max(0,s.exercises.findIndex(e=>e.exerciseId===afterId)+1):0;
  const ordered=[...s.exercises.slice(start),...s.exercises.slice(0,start)];
  return ordered.find(e=>e.status!=='completed'&&e.status!=='skipped'&&e.status!=='deferred') || ordered.find(e=>e.status==='deferred') || null;
}
function advanceAfterStatus(s,e){const n=nextPendingExercise(s,e.exerciseId);state.ui.expandedExerciseId=n?.exerciseId||null;}

function startRest(s,e,set){
  state.restTimer={sessionId:s.id,exerciseId:e.exerciseId,setId:set.id,startedAt:now(),targetSec:Number(set.targetRest||e.rest||0),pausedAt:null,totalPausedMs:0};
  set.restStartedAt=state.restTimer.startedAt;persist(true);ensureRestTicker();
}
function stopRest(source='manual',silent=false){
  const r=state.restTimer;if(!r)return;
  const s=getSession(r.sessionId);const e=s?.exercises.find(x=>x.exerciseId===r.exerciseId);const set=e?.sets.find(x=>x.id===r.setId);
  const end=now(); const pausedMs=(r.totalPausedMs||0)+(r.pausedAt?Math.max(0,end-r.pausedAt):0); if(set){set.restEndedAt=end;set.restEndSource=source;set.restPausedMs=pausedMs;}
  state.restTimer=null;persist(true);renderRestDock();if(!silent)haptic(18);
}
function pauseRest(){const r=state.restTimer;if(!r)return;if(r.pausedAt){r.totalPausedMs+=now()-r.pausedAt;r.pausedAt=null;}else r.pausedAt=now();persist(true);renderRestDock();}
function restElapsedMs(r){const end=r.pausedAt||now();return Math.max(0,end-r.startedAt-(r.totalPausedMs||0));}
function ensureRestTicker(){clearInterval(restInterval);restInterval=setInterval(()=>{if(!state.restTimer){clearInterval(restInterval);return;}renderRestDock(true);checkRestFinished();},500);}
let restFinishedSignalFor=null;
function checkRestFinished(){const r=state.restTimer;if(!r)return;const elapsed=restElapsedMs(r)/1000;if(elapsed>=r.targetSec&&restFinishedSignalFor!==r.setId){restFinishedSignalFor=r.setId;haptic([80,60,120]);playSound('rest');}}
function renderRestDock(light=false){
  const dock=document.getElementById('rest-dock');if(!dock)return;
  const r=state.restTimer;if(!r || currentSessionId!==r.sessionId){dock.classList.add('hidden');dock.innerHTML='';return;}
  const s=getSession(r.sessionId),e=s?.exercises.find(x=>x.exerciseId===r.exerciseId),set=e?.sets.find(x=>x.id===r.setId);if(!s||!e||!set){state.restTimer=null;persist(true);dock.classList.add('hidden');return;}
  const elapsed=restElapsedMs(r)/1000;const remaining=r.targetSec-elapsed;const over=remaining<0;const pct=r.targetSec?clamp((r.targetSec-elapsed)/r.targetSec*100,0,100):0;
  const nxt=nextSetAfter(s,e,set);
  const nextText=nxt?`${nxt.exercise.name} · ${nxt.set.type==='warmup'?'Aquec.':'Série'} ${nxt.set.index}`:'Treino concluído';
  dock.classList.remove('hidden');
  dock.innerHTML=`<div class="rest-top"><div><div class="tiny muted">Descanso</div><div class="rest-time ${over?'over':''}">${over?'+'+secondsToClock(Math.abs(remaining)):secondsToClock(remaining)}</div></div><div style="min-width:0;text-align:right"><div class="rest-next">A seguir → ${esc(nextText)}</div><div class="rest-controls"><button class="ghost" id="rest-pause">${r.pausedAt?'Continuar':'Pausa'}</button><button class="secondary" id="rest-end">Terminar descanso</button></div></div></div><div class="rest-bar"><span style="width:${pct}%"></span></div>`;

function calendarHTML(ym,selected){
  const [y,m]=ym.split('-').map(Number);const first=new Date(y,m-1,1);const start=new Date(y,m-1,1-first.getDay());const cells=[];
  for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const ds=isoDate(d);const ss=sessionsForDate(ds);const abs=state.plannedAbsences.some(a=>ds>=a.start&&ds<=a.end);let cls='';if(ss.some(s=>s.status==='completed'&&s.exercises.some(e=>e.status==='skipped')))cls='has-skipped';else if(ss.some(s=>s.status==='completed'))cls='has-complete';else if(ss.some(s=>s.status==='incomplete'||s.status==='active'))cls='has-incomplete';else if(abs)cls='has-absence';cells.push(`<button class="cal-day ${d.getMonth()!==m-1?'out':''} ${ds===isoDate()?'today':''} ${ds===selected?'selected':''} ${cls}" data-date="${ds}">${d.getDate()}</button>`);}
  return `<div class="calendar-head"><button class="ghost" id="cal-prev">‹</button><strong>${first.toLocaleDateString('pt-PT',{month:'long',year:'numeric'})}</strong><button class="ghost" id="cal-next">›</button></div><div class="calendar-grid">${DOW.map(x=>`<div class="cal-dow">${x}</div>`).join('')}${cells.join('')}</div><div class="legend"><span>● concluído</span><span>● incompleto</span><span>● com saltados</span><span>● ausência</span></div>`;
}

function exerciseProgressHTML(id){
  const points=[];const rows=[];
  const entries=state.sessions.filter(s=>s.status==='completed'||s.status==='incomplete').sort((a,b)=>a.date.localeCompare(b.date)).flatMap(s=>{const e=s.exercises.find(x=>x.exerciseId===id);return e?[{s,e}]:[];});
  for(const {s,e} of entries){const work=e.sets.filter(x=>x.type==='work'&&x.done);if(!work.length)continue;const maxLoad=Math.max(...work.map(x=>numericTotalLoad(x.weight,e.loadMode,e.unilateral)));const totalReps=work.reduce((a,x)=>a+Number(e.unilateral?x.repsLeft:x.reps||0),0);const vol=exerciseVolume(e);points.push({x:s.date,y:maxLoad});rows.push(`<div class="preview-item"><div class="preview-top"><strong>${fmtDate(s.date)}</strong><span>${maxLoad?displayNum(maxLoad)+' kg':'—'}</span></div><div class="preview-target">${totalReps} reps · volume ${Math.round(vol).toLocaleString('pt-PT')}</div></div>`);}
  const pr=points.length?Math.max(...points.map(p=>p.y)):0;
  return `<div class="grid-2"><div class="stat"><div class="label">Maior carga total</div><div class="value">${pr?displayNum(pr)+' kg':'—'}</div></div><div class="stat"><div class="label">Sessões</div><div class="value">${entries.length}</div></div></div><div class="chart" style="margin-top:10px">${chartSVG(points)}</div><div class="preview-list" style="margin-top:10px">${rows.slice(-8).reverse().join('')||'<div class="muted small">Sem histórico.</div>'}</div>`;
}
function chartSVG(points){
  const p=points.filter(x=>Number.isFinite(x.y)&&x.y>0);if(p.length<2)return `<div class="chart-empty">Ainda sem dados suficientes para gráfico.</div>`;
  const ys=p.map(x=>x.y),min=Math.min(...ys),max=Math.max(...ys),range=max-min||1;const coords=p.map((x,i)=>`${10+(i/(p.length-1))*80},${90-((x.y-min)/range)*70}`);return `<svg viewBox="0 0 100 100" preserveAspectRatio="none"><polyline class="chart-line" points="${coords.join(' ')}"></polyline>${coords.map(c=>{const [x,y]=c.split(',');return `<circle class="chart-dot" cx="${x}" cy="${y}" r="1.7"></circle>`}).join('')}</svg>`;
}
function openWeightModal(){
  modal(`<button class="modal-close" data-close>×</button><h3>Registar peso corporal</h3><div class="form-grid"><label class="label">Data<input id="weight-date" type="date" class="input" value="${isoDate()}"></label><label class="label">Peso (kg)<input id="weight-value" inputmode="decimal" class="input" placeholder="62"></label></div><div class="modal-actions"><button class="secondary" data-close>Cancelar</button><button class="primary" id="weight-save">Guardar</button></div>`,root=>{root.querySelector('#weight-save').onclick=()=>{const w=parseNumber(root.querySelector('#weight-value').value),date=root.querySelector('#weight-date').value;if(!w||w<20||w>300){toast('Peso inválido.');return;}const existing=state.weightHistory.find(x=>x.date===date);if(existing)existing.weight=w;else state.weightHistory.push({id:uid('w'),date,weight:w});persist(true);closeModal();render();};});

function needsWeightReminder(){
  const d=new Date();if(d.getDay()!==1)return false;const latest=[...state.weightHistory].sort((a,b)=>b.date.localeCompare(a.date))[0];return !latest||daysAgo(latest.date)>=7;
}
function daysAgo(date){return Math.floor((dateFromISO(isoDate())-dateFromISO(date))/86400000);}
function weekRange(d){const x=new Date(d);const day=(x.getDay()+6)%7;const start=new Date(x);start.setDate(x.getDate()-day);const end=new Date(start);end.setDate(start.getDate()+6);return{start:isoDate(start),end:isoDate(end)};}
function uniqueExercisesFromPlan(){const m=new Map();for(const d of DAYS)for(const e of planDay(d)?.exercises||[])if(e.active!==false&&!m.has(e.id))m.set(e.id,e);return [...m.values()];}
function performanceFlags(){
  const flags=[];
  for(const ex of uniqueExercisesFromPlan()){
    const entries=lastSessionsForExercise(ex.id,null,4).reverse();if(entries.length<3)continue;
    const scores=entries.map(({exercise:e})=>exerciseScore(e));
    if(scores.every(x=>x!==null)){
      const spread=Math.max(...scores)-Math.min(...scores);const mean=scores.reduce((a,b)=>a+b,0)/scores.length;
      if(mean>0&&spread/mean<0.04)flags.push({name:ex.name,text:`Sem progresso detectável nas últimas ${scores.length} sessões.`});
      if(scores.length>=3&&scores.every((x,i)=>i===0||x<scores[i-1]*0.985))flags.push({name:ex.name,text:'Queda consistente de desempenho detectada. Rever contexto antes de ajustar o plano.'});
    }
  }
  return flags.slice(0,8);
}
function exerciseScore(e){const work=e.sets?.filter(s=>s.type==='work'&&s.done)||[];if(!work.length)return null;return work.reduce((a,s)=>a+numericTotalLoad(s.weight,e.loadMode,e.unilateral)*Number(e.unilateral?s.repsLeft:s.reps||0),0);}
function exerciseVolume(e){return exerciseScore(e)||0;}
function sessionStats(s){let volume=0,workSets=0;for(const e of s.exercises||[]){for(const set of e.sets||[]){if(set.type!=='work'||!set.done)continue;workSets++;const reps=Number(e.unilateral?set.repsLeft:set.reps||0);volume+=numericTotalLoad(set.weight,e.loadMode,e.unilateral)*reps;}}return{volume,workSets};}

function openPatchModal(){
  modal(`<button class="modal-close" data-close>×</button><h3>Aplicar patch do ChatGPT</h3><p class="small muted">Cola manualmente o patch. Nada é aplicado antes da pré-visualização.</p><textarea id="patch-text" class="textarea code" style="min-height:190px" placeholder='{"type":"hipertrofia-pro-patch", ...}'></textarea><div class="modal-actions"><button class="secondary" data-close>Cancelar</button><button class="primary" id="patch-preview-btn">Pré-visualizar</button></div>`,root=>{root.querySelector('#patch-preview-btn').onclick=()=>{const obj=parsePatch(root.querySelector('#patch-text').value);if(!obj){toast('Patch inválido.');return;}openPatchPreview(obj);};});
}
function parsePatch(text){
  let obj=safeJSON(text.trim());if(!obj){const start=text.indexOf('{"type"');if(start>=0){for(let end=text.length;end>start;end--){obj=safeJSON(text.slice(start,end));if(obj)break;}}}
  if(!obj||obj.type!=='hipertrofia-pro-patch'||!Array.isArray(obj.changes))return null;return obj;
}
function openPatchPreview(patch){
  const items=patch.changes.map(c=>describeChange(c));
  modal(`<button class="modal-close" data-close>×</button><h3>Pré-visualização</h3><p class="small muted">${esc(patch.label||'Patch sem descrição')}</p><div class="patch-preview">${items.map(i=>`<div class="patch-change">${esc(i)}</div>`).join('')}</div><div class="modal-actions"><button class="secondary" data-close>Cancelar</button><button class="primary" id="apply-patch">Aplicar alterações</button></div>`,root=>{root.querySelector('#apply-patch').onclick=()=>{applyPatch(patch);closeModal();toast('Patch aplicado. Podes desfazer pelo Histórico do plano.');render();};});
}
function describeChange(c){
  const d=c.day||'';const ex=c.id?findPlanExercise(d,c.id):null;
  if(c.op==='update')return `${d} · ${ex?.name||c.id}: actualizar ${Object.keys(c.set||{}).join(', ')}`;
  if(c.op==='pause')return `${d} · ${ex?.name||c.id}: pausar`;
  if(c.op==='resume')return `${d} · ${ex?.name||c.id}: reactivar`;
  if(c.op==='add')return `${d}: adicionar ${c.exercise?.name||'exercício'}`;
  if(c.op==='remove')return `${d} · ${ex?.name||c.id}: remover`;
  if(c.op==='reorder')return `${d}: alterar ordem dos exercícios`;
  if(c.op==='day')return `${d}: actualizar dados do dia`;
  return `${d} · operação ${c.op}`;
}
function applyPatch(patch){
  const before=deepClone(state.plan);state.planBackups.unshift({id:uid('planbackup'),at:now(),label:patch.label||'Antes do patch',plan:before});state.planBackups=state.planBackups.slice(0,10);
  for(const c of patch.changes){
    const day=planDay(c.day);if(!day)continue;
    if(c.op==='update'){const e=day.exercises.find(x=>x.id===c.id);if(e&&c.set)Object.assign(e,c.set);}
    else if(c.op==='pause'){const e=day.exercises.find(x=>x.id===c.id);if(e)e.active=false;}
    else if(c.op==='resume'){const e=day.exercises.find(x=>x.id===c.id);if(e)e.active=true;}
    else if(c.op==='add'&&c.exercise){if(!day.exercises.some(x=>x.id===c.exercise.id))day.exercises.push(c.exercise);}
    else if(c.op==='remove'){day.exercises=day.exercises.filter(x=>x.id!==c.id);}
    else if(c.op==='reorder'&&Array.isArray(c.ids)){const map=new Map(day.exercises.map(e=>[e.id,e]));day.exercises=[...c.ids.map(id=>map.get(id)).filter(Boolean),...day.exercises.filter(e=>!c.ids.includes(e.id))];}
    else if(c.op==='day'&&c.set)Object.assign(day,c.set);
  }
  state.plan.revision=patch.revision||`patch-${isoDate()}-${now()}`;
  state.planHistory.unshift({id:uid('ph'),at:now(),source:'patch',label:patch.label||'Patch ChatGPT',changes:deepClone(patch.changes)});
  state.planHistory.forEach(x=>{if(x.source==='manual')x.acknowledgedByPatch=true;});persist(true);
}
function findPlanExercise(day,id){return planDay(day)?.exercises.find(e=>e.id===id)||null;}
function openPlanHistory(){
  const rows=state.planHistory.slice(0,20);modal(`<button class="modal-close" data-close>×</button><h3>Histórico do plano</h3>${rows.length?rows.map(r=>`<div class="card slim"><strong>${esc(r.label)}</strong><div class="tiny muted">${new Date(r.at).toLocaleString('pt-PT')} · ${r.source==='patch'?'Patch ChatGPT':'Alteração manual'}</div></div>`).join(''):'<p class="muted small">Ainda sem alterações registadas.</p>'}${state.planBackups.length?`<hr class="sep"><button id="undo-last-plan" class="danger" style="width:100%">Restaurar versão anterior ao último patch</button>`:''}`,root=>{const b=root.querySelector('#undo-last-plan');if(b)b.onclick=()=>openConfirm('Restaurar plano','O plano actual será substituído pela cópia anterior ao último patch. O histórico de treinos não é alterado.',()=>{const bak=state.planBackups.shift();if(bak){state.plan=deepClone(bak.plan);state.planHistory.unshift({id:uid('ph'),at:now(),source:'manual',label:'Restauro de plano'});persist(true);closeModal();render();}});});
}

function openEditor(){
  const day=state.ui.editorDay||state.settings.selectedDay;state.ui.editorDay=day;
  modal(`<button class="modal-close" data-close>×</button><h3>Editor manual</h3><p class="small muted">Secundário. O fluxo normal é relatório → análise → patch.</p><div class="day-switcher">${DAYS.map(d=>`<button class="day-btn ${d===day?'active':''}" data-ed-day="${d}">${d.slice(0,3)}</button>`).join('')}</div><div class="editor-list" id="editor-list">${planDay(day).exercises.map(e=>editorItemHTML(e)).join('')}</div><button class="secondary" id="editor-add" style="width:100%;margin-top:10px">Adicionar exercício</button>`,root=>{
    root.querySelectorAll('[data-ed-day]').forEach(b=>b.onclick=()=>{state.ui.editorDay=b.dataset.edDay;persist();closeModal();openEditor();});
    bindDragEditor(root.querySelector('#editor-list'),day);
    root.querySelectorAll('[data-edit-ex]').forEach(b=>b.onclick=()=>openEditExercise(day,b.dataset.editEx));
    root.querySelector('#editor-add').onclick=()=>openEditExercise(day,null);
  });
}
function editorItemHTML(e){return `<div class="editor-item" draggable="true" data-editor-id="${e.id}"><div class="drag-handle">≡</div><div class="grow"><strong>${esc(e.name)}</strong><small>${e.active===false?'Pausado · ':''}${esc(fmtTarget(e))}</small></div><button class="ghost" data-edit-ex="${e.id}">Editar</button></div>`;}
function bindDragEditor(list,day){
  const saveOrder=()=>{const ids=[...list.querySelectorAll('.editor-item')].map(x=>x.dataset.editorId);const dayObj=planDay(day),map=new Map(dayObj.exercises.map(e=>[e.id,e]));dayObj.exercises=ids.map(id=>map.get(id)).filter(Boolean);recordManualPlan(`Ordem alterada em ${day}`);persist(true);};
  list.querySelectorAll('.editor-item').forEach(item=>{
    item.addEventListener('dragstart',()=>{dragInfo=item.dataset.editorId;item.classList.add('dragging');});
    item.addEventListener('dragend',()=>{item.classList.remove('dragging');dragInfo=null;saveOrder();});
    item.addEventListener('dragover',ev=>{ev.preventDefault();const moving=list.querySelector(`[data-editor-id="${dragInfo}"]`);if(!moving||moving===item)return;const r=item.getBoundingClientRect();list.insertBefore(moving,ev.clientY<r.top+r.height/2?item:item.nextSibling);});
    const handle=item.querySelector('.drag-handle');
    let touchMove=null;
    handle?.addEventListener('pointerdown',ev=>{if(ev.pointerType==='mouse')return;dragInfo=item.dataset.editorId;item.classList.add('dragging');handle.setPointerCapture?.(ev.pointerId);touchMove=moveEv=>{const target=document.elementFromPoint(moveEv.clientX,moveEv.clientY)?.closest?.('.editor-item');if(!target||target===item||target.parentElement!==list)return;const r=target.getBoundingClientRect();list.insertBefore(item,moveEv.clientY<r.top+r.height/2?target:target.nextSibling);};handle.addEventListener('pointermove',touchMove);});
    handle?.addEventListener('pointerup',ev=>{if(ev.pointerType==='mouse')return;if(touchMove)handle.removeEventListener('pointermove',touchMove);item.classList.remove('dragging');dragInfo=null;saveOrder();});
    handle?.addEventListener('pointercancel',()=>{if(touchMove)handle.removeEventListener('pointermove',touchMove);item.classList.remove('dragging');dragInfo=null;});
  });
  list.addEventListener('drop',ev=>{ev.preventDefault();saveOrder();});
}
function openEditExercise(day,id){
  const old=id?findPlanExercise(day,id):null;const e=old?deepClone(old):ex(uid('custom-ex'),'Novo exercício',3,'','8–12',90,'total',null,'','','');
  modal(`<button class="modal-close" data-close>×</button><h3>${old?'Editar exercício':'Novo exercício'}</h3><div class="form-grid"><label class="label">Nome<input id="ee-name" class="input" value="${esc(e.name)}"></label><div class="grid-2"><label class="label">Séries<input id="ee-sets" class="input" inputmode="numeric" value="${e.sets}"></label><label class="label">Reps alvo<input id="ee-reps" class="input" value="${esc(e.targetReps)}"></label></div><div class="grid-2"><label class="label">Carga alvo<input id="ee-weight" class="input" value="${esc(e.targetWeight)}"></label><label class="label">Descanso (s)<input id="ee-rest" class="input" inputmode="numeric" value="${e.rest}"></label></div><label class="label">Tipo de carga<select id="ee-mode" class="select">${['total','perSide','twoDumbbells','singleDumbbell','bodyweight','custom'].map(x=>`<option ${e.loadMode===x?'selected':''} value="${x}">${x}</option>`).join('')}</select></label><label class="label">Técnica<textarea id="ee-exec" class="textarea">${esc(e.execution||'')}</textarea></label><label class="label">Progressão<textarea id="ee-prog" class="textarea">${esc(e.progression||'')}</textarea></label><label class="banner"><div><strong>Activo</strong></div><input id="ee-active" type="checkbox" ${e.active!==false?'checked':''}></label></div><div class="modal-actions">${old?'<button class="danger" id="ee-delete">Remover</button>':''}<button class="primary" id="ee-save">Guardar</button></div>`,root=>{
    root.querySelector('#ee-save').onclick=()=>{e.name=root.querySelector('#ee-name').value.trim()||e.name;e.sets=Math.max(1,Number(root.querySelector('#ee-sets').value)||1);e.targetReps=root.querySelector('#ee-reps').value;e.targetWeight=root.querySelector('#ee-weight').value;e.rest=Math.max(0,Number(root.querySelector('#ee-rest').value)||0);e.loadMode=root.querySelector('#ee-mode').value;e.execution=root.querySelector('#ee-exec').value;e.progression=root.querySelector('#ee-prog').value;e.active=root.querySelector('#ee-active').checked;if(old)Object.assign(old,e);else planDay(day).exercises.push(e);recordManualPlan(`${old?'Editado':'Adicionado'}: ${e.name}`);persist(true);closeModal();openEditor();};
    const del=root.querySelector('#ee-delete');if(del)del.onclick=()=>openConfirm('Remover exercício',`Remover ${e.name} do plano? O histórico anterior não será apagado.`,()=>{planDay(day).exercises=planDay(day).exercises.filter(x=>x.id!==id);recordManualPlan(`Removido: ${e.name}`);persist(true);closeModal();openEditor();});
  });
}
function recordManualPlan(label){state.planHistory.unshift({id:uid('ph'),at:now(),source:'manual',label,acknowledgedByPatch:false});}

function buildChatGPTReport(s){
  const gapInfo=previousGapText(s);const stats=sessionStats(s);
  const lines=[];lines.push(`HIPERTROFIA PRO — RELATÓRIO DE TREINO`);lines.push(`Data: ${s.date} (${s.day})`);lines.push(`Treino: ${s.title}`);lines.push(`Estado: ${statusText(s)}`);lines.push(`Duração: ${formatDuration((s.endedAt||now())-(s.startedAt||now()))}`);lines.push(`Volume de trabalho estimado: ${Math.round(stats.volume)} kg·reps`);if(gapInfo)lines.push(gapInfo);if(s.sessionNote)lines.push(`Observação geral da sessão: ${s.sessionNote}`);if(s.manualPlanChangesAtStart?.length)lines.push(`ATENÇÃO: existiam alterações manuais ao plano desde o último patch.`);lines.push('');
  s.exercises.forEach((e,i)=>{
    lines.push(`${i+1}. ${e.name}`);lines.push(`Estado: ${e.status}`);lines.push(`Alvo actual: ${fmtLoad(e.targetWeight,e.loadMode,true)} | ${e.targetReps||'reps livres'} | ${e.sets.filter(x=>x.type==='work').length} séries | descanso ${e.rest}s`);
    if(e.skipReason)lines.push(`Motivo de salto: ${e.skipReason}`);
    for(const set of e.sets){
      const kind=set.type==='warmup'?`Aquecimento ${set.index}`:`Série ${set.index}`;const reps=e.unilateral?`E ${set.repsLeft||'-'} / D ${set.repsRight||'-'}`:`${set.reps||'-'} reps`;let rest='';if(set.restStartedAt&&set.restEndedAt){const actualRest=Math.max(0,set.restEndedAt-set.restStartedAt-(set.restPausedMs||0));rest=` | descanso registado ${secondsToClock(actualRest/1000)}${set.restEndSource&&set.restEndSource!=='manual'?' ('+set.restEndSource+')':''}`;}lines.push(`- ${kind}: ${set.done?fmtLoad(set.weight,e.loadMode):'não concluída'} | ${set.done?reps:'—'}${rest}${set.note?` | nota: ${set.note}`:''}`);
    }
    if(e.generalNote)lines.push(`Observação do exercício: ${e.generalNote}`);
    const prev=lastSessionsForExercise(e.exerciseId,s.date,3);if(prev.length){lines.push('Últimas sessões do mesmo exercício:');prev.forEach(p=>lines.push(`  • ${p.session.date}: ${compactExerciseResult(p.exercise)}`));}
    lines.push('');
  });
  const flags=performanceFlags().filter(f=>s.exercises.some(e=>e.name===f.name));if(flags.length){lines.push('Sinais automáticos (informativos, NÃO são decisões de progressão):');flags.forEach(f=>lines.push(`- ${f.name}: ${f.text}`));lines.push('');}
  lines.push('INSTRUÇÃO PARA CHATGPT: analisa a sessão, técnica, reps, carga, descansos, observações e tendência das últimas sessões. Decide por exercício: ↑ aumentar, → manter, ↓ reduzir, ⚙️ corrigir técnica ou substituir. A aplicação não deve decidir progressão autonomamente. Se houver alterações, devolve um patch hipertrofia-pro-patch compatível com a v7.');
  return lines.join('\n');
}
function previousGapText(s){const prev=state.sessions.filter(x=>x.id!==s.id&&(x.status==='completed'||x.status==='incomplete')&&x.startedAt<s.startedAt).sort((a,b)=>b.startedAt-a.startedAt)[0];if(!prev)return'';const days=Math.floor((dateFromISO(s.date)-dateFromISO(prev.date))/86400000);return days>=5?`Pausa desde a sessão anterior: ${days} dias.`:'';}

function backupObject(){return {type:'hipertrofia-pro-v7-backup',schema:SCHEMA,version:VERSION,createdAt:new Date().toISOString(),state};}
function exportBackup(){
  const text=JSON.stringify(backupObject(),null,2),name=`hipertrofia-pro-v7-backup-${isoDate()}.json`;
  try{if(nativeAvailable()&&window.NativeBridge.exportBackup){window.NativeBridge.exportBackup(text,name);return;}}catch{}
  const blob=new Blob([text],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function importBackupText(text){
  const obj=safeJSON(text);if(!obj){toast('Ficheiro inválido.');return;}
  let incoming=null;if(obj.type==='hipertrofia-pro-v7-backup'&&obj.state)incoming=obj.state;else if(obj.type==='hipertrofia-pro-backup'){incoming=convertV6Backup(obj);}
  if(!incoming){toast('Backup não reconhecido.');return;}
  openConfirm('Importar backup','Os dados actuais serão substituídos. Será guardada uma cópia automática antes da importação.',()=>{rotateSnapshot();state=normalizeState(incoming);persist(true);closeModal();render();toast('Backup importado.');});
}
function handleImportFile(file){const reader=new FileReader();reader.onload=()=>importBackupText(String(reader.result||''));reader.readAsText(file);}
window.receiveNativeBackup=text=>importBackupText(String(text||''));
function convertV6Backup(b){
  const s=initialState();if(Array.isArray(b.weightHistory))s.weightHistory=b.weightHistory.map(w=>({id:w.id||uid('w'),date:w.date||isoDate(),weight:Number(w.weight)||0})).filter(x=>x.weight>0);return s;
}

function modal(html,onOpen){const root=document.getElementById('modal-root');root.innerHTML=`<div class="modal-backdrop"><div class="modal">${html}</div></div>`;const box=root.querySelector('.modal');root.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal);root.querySelector('.modal-backdrop').addEventListener('click',e=>{if(e.target.classList.contains('modal-backdrop'))closeModal();});if(onOpen)onOpen(box);}
function closeModal(){document.getElementById('modal-root').innerHTML='';}
function openConfirm(title,text,onYes){modal(`<button class="modal-close" data-close>×</button><h3>${esc(title)}</h3><p class="small muted">${esc(text)}</p><div class="modal-actions"><button class="secondary" data-close>Cancelar</button><button class="primary" id="confirm-yes">Confirmar</button></div>`,root=>{root.querySelector('#confirm-yes').onclick=()=>{closeModal();onYes();};});}
function copyText(text,msg='Copiado.'){
  try{if(nativeAvailable()&&window.NativeBridge.copyText){window.NativeBridge.copyText(text);toast(msg);return Promise.resolve();}}catch{}
  if(navigator.clipboard?.writeText)return navigator.clipboard.writeText(text).then(()=>toast(msg)).catch(()=>fallbackCopy(text,msg));
  fallbackCopy(text,msg);return Promise.resolve();
}
function fallbackCopy(text,msg){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast(msg);}
function openExternal(url){try{if(nativeAvailable()&&window.NativeBridge.openExternal){window.NativeBridge.openExternal(url);return;}}catch{}window.open(url,'_blank','noopener');}

function playSound(kind){if(!state.settings.sounds)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();const freq=kind==='rest'?880:kind==='finish'?660:520;o.frequency.value=freq;g.gain.setValueAtTime(.001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.08,audioCtx.currentTime+.015);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+(kind==='rest'?.22:.12));o.connect(g).connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+(kind==='rest'?.24:.14));}catch{}}
function haptic(pattern=20){
  try{if(nativeAvailable()){if(Array.isArray(pattern)&&window.NativeBridge.hapticPattern){window.NativeBridge.hapticPattern(pattern.join(','));return;}if(!Array.isArray(pattern)&&window.NativeBridge.haptic){window.NativeBridge.haptic(Number(pattern)||20);return;}}}catch{}
  try{navigator.vibrate?.(pattern);}catch{}
}
async function requestWakeLock(){
  try{if(nativeAvailable()&&window.NativeBridge.setKeepScreenOn)window.NativeBridge.setKeepScreenOn(true);}catch{}
  try{const isiOS=/iPhone|iPad|iPod/i.test(navigator.userAgent);if(!isiOS&&'wakeLock'in navigator&&!wakeLock){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null;});}}catch{}
}
function releaseWakeLock(){try{if(nativeAvailable()&&window.NativeBridge.setKeepScreenOn)window.NativeBridge.setKeepScreenOn(false);}catch{}try{wakeLock?.release();wakeLock=null;}catch{}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&activeSession())requestWakeLock();});

function setupNav(){document.querySelectorAll('.nav-item').forEach(b=>b.onclick=()=>{state.settings.view=b.dataset.view;persist();render();});}
function setupGlobal(){
  document.getElementById('import-file').addEventListener('change',e=>{const f=e.target.files?.[0];if(f)handleImportFile(f);e.target.value='';});
  window.addEventListener('beforeunload',()=>persist(true));
  window.addEventListener('pagehide',()=>persist(true));
  if(!nativeAvailable()&&'serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
  try{navigator.storage?.persist?.();}catch{}
  ensureRestTicker();recoverIndexedDBIfNewer();
}
window.onNativePause=()=>{persist(true);releaseWakeLock();};
window.onNativeResume=()=>{ensureRestTicker();renderRestDock(true);checkRestFinished();if(activeSession())requestWakeLock();};
window.handleAndroidBack=()=>{
  if(document.getElementById('modal-root')?.children.length){closeModal();return true;}
  if(state.settings.view!=='workout'){state.settings.view='workout';persist(true);render();return true;}
  if(currentSessionId){currentSessionId=null;render();return true;}
  return false;
};
function localPreviewGate(){
  if(config.googleCloudConfigured||state.ui.localPreviewAccepted)return;
  modal(`<h3>Modo local v7</h3><p class="small muted">A conta Google obrigatória e a sincronização cloud continuam pendentes porque exigem credenciais externas do projecto. Até essas credenciais serem configuradas, os dados ficam protegidos localmente com autosave e backups.</p><div class="modal-actions"><button id="accept-local" class="primary">Continuar em modo local</button></div>`,root=>{root.querySelector('#accept-local').onclick=()=>{state.ui.localPreviewAccepted=true;persist(true);closeModal();};});
}

setupNav();setupGlobal();render();localPreviewGate();
if(activeSession())requestWakeLock();

})();

</script>

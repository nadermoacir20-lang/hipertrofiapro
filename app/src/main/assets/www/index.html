:root{

html{background:#050505;color-scheme:dark;scroll-behavior:smooth}
body{background:
  radial-gradient(70vw 50vh at 12% -8%,rgba(255,118,31,.11),transparent 66%),

function ex(id,name,sets,targetWeight,targetReps,rest,loadMode,warmup,execution,progression,notes){
  return {id,name,active:true,sets,targetWeight,targetReps,rest,loadMode,warmup:warmup||{sets:0,weight:'',reps:''},execution,progression,notes:notes||'',unilateral:false};
}
function unilateralEx(id,name,sets,targetWeight,targetReps,rest,loadMode,execution,progression,notes){
  return {...ex(id,name,sets,targetWeight,targetReps,rest,loadMode,null,execution,progression,notes),unilateral:true};
}
function pausedEx(id,name,sets,targetWeight,targetReps,rest,loadMode,notes){
  return {...ex(id,name,sets,targetWeight,targetReps,rest,loadMode,null,'Retomar apenas quando estiver apropriado.','Reavaliar antes de reactivar.',notes),active:false};
}

function loadState(){
  let s = safeJSON(localStorage.getItem(KEY));
  if(!s || typeof s!=='object' || s.schema!==SCHEMA) s=null;
  for(let i=0;i<SNAP_COUNT;i++){
    const cand=safeJSON(localStorage.getItem(SNAP_PREFIX+i));
    if(cand?.schema===SCHEMA) s=newerState(s,cand);
  }
  s=newerState(s,nativeState());
  if(!s){
    const migrated=migrateV6();
    if(migrated)return migrated;
    return initialState();
  }
  return normalizeState(s);
}
function planLooksLikeFinalFamily(plan){
  if(!plan?.days||typeof plan.days!=='object')return false;
  if(!DAYS.every(day=>plan.days[day]&&Array.isArray(plan.days[day].exercises)))return false;
  const ids=new Set(DAYS.flatMap(day=>plan.days[day].exercises.map(e=>e?.id).filter(Boolean)));
  // Marcadores suficientes para distinguir a família final sem impedir futuras
  // remoções/adições depois de a metadata formatVersion ter sido gravada.
  return ['mon-smith','tue-reversepush','wed-chestsupported-row','thu-hipthrust','thu-sidebend','fri-pushdown'].every(id=>ids.has(id));
}
function savePlanBackupOnce(s,label,plan){
  if(!plan?.days)return;
  if(s.planBackups.some(b=>b?.label===label))return;
  s.planBackups.unshift({id:uid('planbackup'),at:now(),label,plan:deepClone(plan)});
  s.planBackups=s.planBackups.slice(0,10);
}
function normalizeState(s){
  const base=initialState();
  if(!s||typeof s!=='object'||Array.isArray(s))return base;

  s.schema=SCHEMA;
  s.version=VERSION;
  s.sessions=Array.isArray(s.sessions)?s.sessions:[];
  s.weightHistory=Array.isArray(s.weightHistory)?s.weightHistory:[];
  s.plannedAbsences=Array.isArray(s.plannedAbsences)?s.plannedAbsences:[];
  s.planHistory=Array.isArray(s.planHistory)?s.planHistory:[];
  s.planBackups=Array.isArray(s.planBackups)?s.planBackups:[];
  s.plan=s.plan?.days?s.plan:deepClone(base.plan);

  const hasPlanMetadata=Number(s.plan?.formatVersion||0)>=PLAN_FORMAT_VERSION;
  const finalFamily=planLooksLikeFinalFamily(s.plan);

  if(hasPlanMetadata){
    // Revisões de patches e alterações manuais são válidas. Nunca se restaura o
    // plano base só porque revision mudou.
    s.plan.formatVersion=PLAN_FORMAT_VERSION;
    s.plan.baseRevision=String(s.plan.baseRevision||BASE_PLAN_REVISION);
  }else if(s.plan?.revision===BASE_PLAN_REVISION||finalFamily){
    // Migração única da v8.0/v8.1: o plano já pertence à família final.
    // Apenas adicionamos metadata; nenhuma progressão/patch do utilizador é apagada.
    s.plan.formatVersion=PLAN_FORMAT_VERSION;
    s.plan.baseRevision=BASE_PLAN_REVISION;
  }else{
    // Só estados realmente anteriores ao plano final são migrados.
    savePlanBackupOnce(s,'Migração automática — plano anterior ao plano final 2026-10-02',s.plan);
    s.sessions.forEach(session=>{
      if(session?.status==='active'){
        session.status='incomplete';
        session.endedAt=session.endedAt||now();
      }
    });
    s.activeSessionId=null;
    s.restTimer=null;
    s.plan=deepClone(DEFAULT_PLAN);
  }

  s.profile={...base.profile,...(s.profile||{})};
  s.settings={...base.settings,...(s.settings||{})};
  s.ui={...base.ui,...(s.ui||{})};

  if(!DAYS.includes(s.settings.selectedDay))s.settings.selectedDay=weekdayToPlan(new Date());
  if(s.activeSessionId&&!s.sessions.some(x=>x?.id===s.activeSessionId&&x.status==='active'))s.activeSessionId=null;
  if(s.restTimer&&!s.sessions.some(x=>x?.id===s.restTimer.sessionId&&x.status==='active'))s.restTimer=null;
  return s;
}
function migrateV6(){
  try{
    const oldPlan=safeJSON(localStorage.getItem('hp5_plan'));
    const oldLogs=safeJSON(localStorage.getItem('hp5_logs'));
    const oldWeight=safeJSON(localStorage.getItem('hp5_weight_history'));
    if(!oldPlan && !oldLogs && !oldWeight) return null;
    const s=initialState();
    if(Array.isArray(oldWeight)) s.weightHistory=oldWeight.map(w=>({id:w.id||uid('w'),date:w.date||isoDate(),weight:Number(w.weight)||0})).filter(w=>w.weight>0);
    // O plano v7 é mantido por segurança; os registos antigos entram como sessões legadas agrupadas.
    if(Array.isArray(oldLogs) && oldLogs.length){
      const groups=new Map();
      for(const l of oldLogs){
        const date=l.date||isoDate(); const day=l.day||weekdayToPlan(dateFromISO(date)); const k=`${date}|${day}`;
        if(!groups.has(k)) groups.set(k,{id:uid('legacy'),date,day,status:'completed',startedAt:dateFromISO(date).getTime(),endedAt:dateFromISO(date).getTime(),legacy:true,exercises:[],planRevision:'legacy'});
        groups.get(k).exercises.push({exerciseId:l.exerciseId||uid('legacy-ex'),name:l.exerciseName||l.exName||'Exercício antigo',status:l.status||'completed',generalNote:l.obs||'',sets:[]});
      }
      s.sessions=[...groups.values()];
    }
    toastLater('Dados antigos encontrados e migrados para a v7.');
    return s;
  }catch{return null;}
}
function persist(immediate=false){
  const doSave=()=>{
    try{
      state.updatedAt=now();
      localStorage.setItem(KEY,JSON.stringify(state));
      setSave('saved','✓ Guardado');
      mirrorIndexedDB();
      if(window.NativeBridge?.saveSnapshot){try{window.NativeBridge.saveSnapshot(JSON.stringify(state));}catch{}}
    }catch(e){ console.error(e); setSave('error','⚠ Erro ao guardar'); }
  };
  setSave('saving','A guardar…');
  clearTimeout(saveTimer);
  if(immediate) doSave(); else saveTimer=setTimeout(doSave,40);
  clearTimeout(snapshotTimer);
  snapshotTimer=setTimeout(rotateSnapshot,1200);
}
function rotateSnapshot(){
  try{
    for(let i=SNAP_COUNT-1;i>0;i--){ const prev=localStorage.getItem(SNAP_PREFIX+(i-1)); if(prev)localStorage.setItem(SNAP_PREFIX+i,prev); }
    localStorage.setItem(SNAP_PREFIX+'0',JSON.stringify(state));
  }catch{}
}
function mirrorIndexedDB(){
  if(!('indexedDB' in window)) return;
  try{
    const req=indexedDB.open('hipertrofia-pro-v7',1);
    req.onupgradeneeded=()=>{ if(!req.result.objectStoreNames.contains('state'))req.result.createObjectStore('state'); };
    req.onsuccess=()=>{ const tx=req.result.transaction('state','readwrite'); tx.objectStore('state').put(state,'main'); };
  }catch{}
}
function recoverIndexedDBIfNewer(){
  if(!('indexedDB' in window))return;
  try{
    const req=indexedDB.open('hipertrofia-pro-v7',1);
    req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('state'))req.result.createObjectStore('state');};
    req.onsuccess=()=>{
      try{
        const tx=req.result.transaction('state','readonly'),get=tx.objectStore('state').get('main');
        get.onsuccess=()=>{const cand=get.result;if(cand?.schema===SCHEMA&&Number(cand.updatedAt||0)>Number(state.updatedAt||0)){state=normalizeState(cand);persist(true);render();toast('Dados recuperados da cópia local de segurança.');}};
      }catch{}
    };
  }catch{}
}

function fmtLoad(weight,mode,target=false){
  const w=String(weight??'').trim();
  if(mode==='bodyweight') return 'Peso corporal';
  if(!w) return target?'Carga a definir':'—';
  const n=parseNumber(w);
  if(n!==null && ['perSide','twoDumbbells'].includes(mode)) return `${displayNum(n)}+${displayNum(n)} kg`;
  if(n!==null) return `${displayNum(n)} kg`;

}

function numericTotalLoad(weight,mode,unilateral=false){

  if(mode==='perSide'||mode==='twoDumbbells')return n*2;

}
function parseRepRange(s){const m=String(s||'').match(/(\d+)\D+(\d+)/);return m?{min:+m[1],max:+m[2]}:null;}

function normalizeDirectBodyState(raw){
  const out={};
  if(!raw||typeof raw!=='object')return out;
  for(const [id,value] of Object.entries(raw)){
    if(!id||typeof id!=='string')continue;
    const n=typeof value==='object'&&value!==null?Number(value.intensity):Number(value);
    if(!Number.isFinite(n)||n<=0)continue;
    out[id]={intensity:clamp(Math.round(n),1,10),selected:false};
  }
  return out;
}
function normalizeMuscleMap(raw){
  if(!raw||typeof raw!=='object')return null;
  const levels={};
  for(const [key,value] of Object.entries(raw.levels||{})){
    const n=clamp(Math.round(Number(value)||0),0,3);if(n>0)levels[key]=n;
  }
  const bodyState=normalizeDirectBodyState(raw.bodyState||raw.muscles||{});
  if(!Object.keys(levels).length&&!Object.keys(bodyState).length)return null;
  return {
    region:String(raw.region||'full'),title:String(raw.title||'MAPA MUSCULAR'),
    side:raw.side==='left'||raw.side==='right'?raw.side:null,
    levels,bodyState,legend:Array.isArray(raw.legend)?raw.legend.slice(0,8):null
  };
}
function muscleProfileFor(exerciseOrId,day){
  const id=typeof exerciseOrId==='string'?exerciseOrId:exerciseOrId?.id||exerciseOrId?.exerciseId;
  const direct=typeof exerciseOrId==='object'?exerciseOrId?.muscleMap:null;
  if(direct){const normalized=normalizeMuscleMap(direct);if(normalized)return normalized;}
  if(day&&id){const planEx=findPlanExercise(day,id);if(planEx?.muscleMap){const normalized=normalizeMuscleMap(planEx.muscleMap);if(normalized)return normalized;}}
  return BUILTIN_MUSCLE_PROFILES[id]||null;
}
function profileBodyState(profile){
  const out=normalizeDirectBodyState(profile?.bodyState||{});
  const side=profile?.side;
  const allows=id=>!side||id.endsWith(`-${side}`)||(!id.endsWith('-left')&&!id.endsWith('-right'));
  if(side){for(const id of Object.keys(out))if(!allows(id))delete out[id];}
  for(const [key,level] of Object.entries(profile?.levels||{})){
    const intensity=BODY_LEVEL_INTENSITY[clamp(Math.round(Number(level)||0),1,3)]||3;
    for(const id of BODY_ABSTRACT_MAP[key]||[]){
      if(!allows(id))continue;
      const current=Number(out[id]?.intensity||0);if(intensity>current)out[id]={intensity,selected:false};
    }
  }
  return out;
}
function muscleIntensity(profile,key){return Number(profile?.levels?.[key]||0)}
function anatomySummary(profile){
  if(Array.isArray(profile?.legend)&&profile.legend.length){
    return profile.legend.map((item,i)=>`<div class="anatomy-legend-item ${i===0?'primary-muscle':'secondary-muscle'}"><span class="anatomy-dot"></span><span><strong>${esc(typeof item==='string'?item:(item.label||item.name||''))}</strong><small>${i===0?'Maior ênfase':'Participa também'}</small></span></div>`).join('');
  }
  const entries=Object.entries(profile?.levels||{}).filter(([,v])=>v>=2).sort((a,b)=>b[1]-a[1]);
  if(entries.length)return entries.slice(0,4).map(([k,v])=>`<div class="anatomy-legend-item ${v>=3?'primary-muscle':'secondary-muscle'}"><span class="anatomy-dot"></span><span><strong>${esc(MUSCLE_LABELS[k]||k)}</strong><small>${v>=3?'Maior ênfase':'Participa também'}</small></span></div>`).join('');
  const direct=Object.entries(profileBodyState(profile)).sort((a,b)=>b[1].intensity-a[1].intensity).slice(0,4);
  return direct.map(([id,v],i)=>{const base=id.replace(/-(left|right)$/,'');const label=DIRECT_MUSCLE_LABELS[base]||base.replaceAll('-',' ');return `<div class="anatomy-legend-item ${v.intensity>=8||i===0?'primary-muscle':'secondary-muscle'}"><span class="anatomy-dot"></span><span><strong>${esc(label)}</strong><small>${v.intensity>=8?'Maior ênfase':'Participa também'}</small></span></div>`;}).join('');
}
let activeBodyCharts=[];
function muscleMapHTML(exerciseOrId,day){
  const profile=muscleProfileFor(exerciseOrId,day||activeSession()?.day);if(!profile)return '';
  const key=typeof exerciseOrId==='string'?exerciseOrId:(exerciseOrId?.exerciseId||exerciseOrId?.id||'exercise');
  return `<section class="anatomy-panel hp-bodymap-panel" aria-label="Mapa muscular deste exercício">
    <div class="bodymap-head"><div><div class="anatomy-kicker">BODY MAP · INTENSIDADE</div><div class="anatomy-title">${esc(profile.title)}</div><p>Quanto mais quente a cor, maior a ênfase estimada neste movimento.</p></div><div class="bodymap-intensity-key"><span><i class="k-low"></i>apoio</span><span><i class="k-mid"></i>secundário</span><span><i class="k-high"></i>principal</span></div></div>

        <div class="body-figure body-back"><span class="body-side-label">COSTAS</span><div class="body-aura"></div><div class="hp-bodymap-host" data-view="back" data-exercise-id="${esc(key)}"></div></div>

    <div class="anatomy-foot"><span>Mapa por regiões · lado esquerdo/direito independentes</span><small>Preparado para exercícios futuros via patch</small></div>

function hydrateBodyMaps(root=document){
  try{
    const lib=window.BodyMuscles;
    const hosts=[...root.querySelectorAll('.hp-bodymap-host:not([data-ready])')];
    if(!hosts.length)return;
    if(!lib?.BodyChart||!lib?.ViewSide){
      hosts.forEach(h=>{h.innerHTML='<div class="bodymap-error">Body map indisponível nesta instalação.</div>';h.dataset.ready='error';h.closest('.body-figure')?.classList.add('body-ready');});
      return;
    }
    const session=activeSession();
    for(const host of hosts){
      try{
        const exId=host.dataset.exerciseId;
        const ex=session?.exercises.find(x=>x.exerciseId===exId)||findPlanExercise(session?.day||state.settings.selectedDay,exId);
        const profile=muscleProfileFor(ex,session?.day||state.settings.selectedDay);
        if(!profile){host.dataset.ready='empty';host.closest('.body-figure')?.classList.add('body-ready');continue;}
        const chart=new lib.BodyChart(host,{view:host.dataset.view==='back'?lib.ViewSide.BACK:lib.ViewSide.FRONT,bodyState:profileBodyState(profile),showViewLabel:false,enableTransitions:true,ariaLabel:`${profile.title} · ${host.dataset.view==='back'?'costas':'frente'}`});
        activeBodyCharts.push(chart);host.dataset.ready='true';
        requestAnimationFrame(()=>host.closest('.body-figure')?.classList.add('body-ready'));
      }catch(err){
        console.error('Body map host:',err);host.dataset.ready='error';host.innerHTML='<div class="bodymap-error">Não foi possível desenhar este mapa.</div>';host.closest('.body-figure')?.classList.add('body-ready');
      }
    }
  }catch(err){
    console.error('Body map hydrate:',err);
    root.querySelectorAll?.('.hp-bodymap-host:not([data-ready])')?.forEach?.(h=>{h.dataset.ready='error';h.innerHTML='<div class="bodymap-error">Mapa indisponível. O treino continua funcional.</div>';h.closest('.body-figure')?.classList.add('body-ready');});
  }
}

function fmtSessionTarget(e){return `${fmtLoad(e.targetWeight,e.loadMode,true)} · ${e.targetReps||'reps livres'} · ${e.sets.filter(s=>s.type==='work').length} séries`;}
function setRowHTML(e,set,si){
  const isCurrent=!set.done && e.sets.slice(0,si).every(x=>x.done);
  const weightCell=e.loadMode==='bodyweight'?`<div class="set-input" style="display:grid;place-items:center;color:#8d98ad">PC</div>`:`<input inputmode="decimal" class="set-input" data-set="${set.id}" data-field="weight" value="${esc(set.weight||'')}" placeholder="${esc(set.targetWeight||'kg')}" aria-label="Peso">`;
  const repsCell=e.unilateral?`<div class="unilateral-reps"><div><input inputmode="numeric" class="set-input" data-set="${set.id}" data-field="repsLeft" value="${esc(set.repsLeft||'')}" placeholder="${esc(set.targetReps||'E')}"><div class="field-caption">E</div></div><div><input inputmode="numeric" class="set-input" data-set="${set.id}" data-field="repsRight" value="${esc(set.repsRight||'')}" placeholder="${esc(set.targetReps||'D')}"><div class="field-caption">D</div></div></div>`:`<input inputmode="numeric" class="set-input" data-set="${set.id}" data-field="reps" value="${esc(set.reps||'')}" placeholder="${esc(set.targetReps||'reps')}" aria-label="Repetições">`;
  return `<div class="set-row ${set.type==='warmup'?'warmup':''} ${set.done?'done':''} ${isCurrent?'current':''}" data-setrow="${set.id}">
    <div class="set-label">${set.type==='warmup'?`Aquec. ${set.index}`:`Série ${set.index}`}</div>${weightCell}${repsCell}
    <button class="note-btn ${set.note?'has-note':''}" data-action="set-note" data-set="${set.id}" title="Observação">💬</button>
    <button class="set-check ${set.done?'done':''}" data-action="toggle-set" data-set="${set.id}" aria-label="Concluir série">✓</button>
  </div>`;
}
function detailsHTML(s,e,planEx){
  const prev=lastSessionsForExercise(e.exerciseId,s.date,3);
  return `<strong>Técnica</strong><br>${esc(e.execution||planEx?.execution||'—')}<br><br><strong>Progressão</strong><br>${esc(e.progression||planEx?.progression||'—')}${e.planNotes?`<br><br><strong>Nota do plano</strong><br>${esc(e.planNotes)}`:''}<br><br><strong>Últimas sessões</strong><br>${prev.length?prev.map(p=>`${fmtDate(p.session.date)} · ${compactExerciseResult(p.exercise)}`).join('<br>'):'Ainda sem histórico suficiente.'}`;
}
function compactExerciseResult(e){
  const work=e.sets?.filter(s=>s.type==='work'&&s.done)||[];
  return work.length?work.map(s=>`${fmtLoad(s.weight,e.loadMode)}×${e.unilateral?(s.repsLeft||'?'):(s.reps||'?')}`).join(' · '):'sem séries concluídas';
}

function bindWorkoutSession(s){
  const root=document.getElementById('main-content');
  requestAnimationFrame(()=>root.classList.add('premium-ready'));

  root.querySelectorAll('[data-focus-ex]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.focusEx;if(!id)return;
    state.ui.expandedExerciseId=id;state.ui.sessionOverview=false;persist();haptic(7);motionCue={type:'exerciseOpen',exerciseId:id};motionRender();
  });
  const goOverview=()=>{state.ui.sessionOverview=true;persist();haptic(6);motionRender();};
  root.querySelector('#focus-overview')?.addEventListener('click',goOverview);
  root.querySelector('#focus-list')?.addEventListener('click',goOverview);
  root.querySelector('#focus-session-overview')?.addEventListener('click',goOverview);

  const focused=s.exercises.find(x=>x.exerciseId===state.ui.expandedExerciseId)||nextPendingExercise(s)||s.exercises[0];
  const focusIndex=Math.max(0,s.exercises.indexOf(focused));
  root.querySelector('[data-focus-prev]')?.addEventListener('click',()=>{if(focusIndex<=0)return;state.ui.expandedExerciseId=s.exercises[focusIndex-1].exerciseId;state.ui.sessionOverview=false;persist();haptic(6);motionRender();});
  root.querySelector('[data-focus-next]')?.addEventListener('click',()=>{if(focusIndex>=s.exercises.length-1)return;state.ui.expandedExerciseId=s.exercises[focusIndex+1].exerciseId;state.ui.sessionOverview=false;persist();haptic(6);motionRender();});

  root.querySelectorAll('[data-field="weight"],[data-field="reps"],[data-field="repsLeft"],[data-field="repsRight"]').forEach(inp=>{
    inp.addEventListener('input',()=>{
      const e=exerciseBySet(s,inp.dataset.set);const set=e?.sets.find(x=>x.id===inp.dataset.set);if(!set)return;
      set[inp.dataset.field]=inp.value;persist();
    });
  });
  root.querySelectorAll('[data-field="general-note"]').forEach(t=>t.addEventListener('input',()=>{const id=t.closest('[data-focus-exercise]')?.dataset.focusExercise||state.ui.expandedExerciseId;const e=s.exercises.find(x=>x.exerciseId===id);if(e){e.generalNote=t.value;persist();}}));
  root.querySelectorAll('[data-action="toggle-set"]').forEach(b=>b.onclick=e=>{e.stopPropagation();toggleSet(s,b.dataset.set);});
  root.querySelectorAll('[data-action="set-note"]').forEach(b=>b.onclick=e=>{e.stopPropagation();openSetNoteModal(s,b.dataset.set);});
  root.querySelectorAll('[data-action="toggle-details"]').forEach(b=>b.onclick=e=>{e.stopPropagation();const d=b.parentElement.querySelector('[data-details]');d?.classList.toggle('open');b.classList.toggle('open',d?.classList.contains('open'));haptic(5);});
  root.querySelectorAll('[data-action="technique-search"]').forEach(b=>{
    b.onclick=ev=>{
      ev.stopPropagation();
      const id=b.closest('[data-focus-exercise]')?.dataset.focusExercise||state.ui.expandedExerciseId;
      const ex=s.exercises.find(x=>x.exerciseId===id);if(!ex)return;
      try{if(nativeAvailable()&&typeof window.NativeBridge.openTechniqueVideo==='function'){window.NativeBridge.openTechniqueVideo(ex.exerciseId);return;}}catch(error){console.error('Erro ao abrir player nativo:',error);}
      toast('Player nativo indisponível nesta instalação.');
    };
  });
  root.querySelectorAll('[data-action="defer"]').forEach(b=>b.onclick=e=>{e.stopPropagation();const ex=s.exercises.find(x=>x.exerciseId===state.ui.expandedExerciseId);if(!ex)return;ex.status='deferred';advanceAfterStatus(s,ex);state.ui.sessionOverview=false;persist(true);haptic(12);motionRender();});
  root.querySelectorAll('[data-action="skip"]').forEach(b=>b.onclick=e=>{e.stopPropagation();openSkipModal(s,state.ui.expandedExerciseId);});
  root.querySelectorAll('[data-action="reopen"]').forEach(b=>b.onclick=e=>{e.stopPropagation();const ex=s.exercises.find(x=>x.exerciseId===state.ui.expandedExerciseId);if(!ex)return;ex.status='pending';persist(true);haptic(10);motionRender();});
  root.querySelector('#finish-session')?.addEventListener('click',()=>openFinishModal(s));

  // Critical: body map is enhancement only. Its failure can never block the workout controls.
  requestAnimationFrame(()=>hydrateBodyMaps(root));
  startSessionClock(s);
}

function startSessionClock(s){
  const el=document.getElementById('session-clock'); if(!el)return;
  const tick=()=>{if(!document.body.contains(el))return;el.textContent=formatDuration(now()-(s.startedAt||now()));setTimeout(tick,1000);}; tick();
}
function formatDuration(ms){const sec=Math.max(0,Math.floor(ms/1000));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${m}:${String(s).padStart(2,'0')}`;}
function exerciseBySet(s,setId){return s.exercises.find(e=>e.sets.some(x=>x.id===setId));}
function validateSet(e,set){
  if(e.loadMode!=='bodyweight' && !String(set.weight||'').trim())return 'Introduz a carga usada.';
  if(e.unilateral){
    if(!String(set.repsLeft||'').trim()||!String(set.repsRight||'').trim())return 'Regista as reps dos dois lados.';
    if(String(set.repsLeft)!==String(set.repsRight))return 'Os dois lados devem ficar com o mesmo número de repetições.';
  }else if(!String(set.reps||'').trim())return 'Introduz as repetições.';
  return '';
}
function toggleSet(s,setId){
  const e=exerciseBySet(s,setId);const set=e?.sets.find(x=>x.id===setId);if(!set)return;
  if(set.done){
    set.done=false;set.completedAt=null;
    if(state.restTimer?.setId===set.id)stopRest('undo',true);
    e.status='pending';state.ui.expandedExerciseId=e.exerciseId;haptic(16);persist(true);render();return;
  }
  const setIndex=e.sets.indexOf(set);
  if(e.sets.slice(0,setIndex).some(x=>!x.done)){toast('Conclui primeiro o aquecimento/série anterior.');return;}
  const err=validateSet(e,set);if(err){toast(err);return;}
  if(state.restTimer && state.restTimer.setId!==set.id) stopRest('next-set-completed',true);
  if(largeWeightDeviation(e,set) && !set.deviationConfirmed){
    openConfirm('Confirmar carga',`Registaste ${fmtLoad(set.weight,e.loadMode)} mas o alvo é ${fmtLoad(set.targetWeight,e.loadMode,true)}. Confirmas que está correcto?`,()=>{set.deviationConfirmed=true;persist(true);toggleSet(s,setId);});return;
  }
  set.done=true;set.completedAt=now();haptic(28);playSound('set');
  const allDone=e.sets.every(x=>x.done);
  if(allDone){e.status='completed';setTimeout(()=>{},0);}
  const next=nextSetAfter(s,e,set);
  if(next){startRest(s,e,set);}
  else {stopRest('workout-end',true);playSound('finish');}
  if(allDone){
    const nxt=nextPendingExercise(s,e.exerciseId); state.ui.expandedExerciseId=nxt?.exerciseId||e.exerciseId;
  }
  motionCue={type:'setComplete',setId:set.id,exerciseId:e.exerciseId};persist(true);render();
  if(allDone && !nextPendingExercise(s)) toast('Último exercício concluído — podes terminar o treino.');
}
function largeWeightDeviation(e,set){
  const a=parseNumber(set.weight),t=parseNumber(set.targetWeight); if(a===null||t===null||t===0)return false;
  return Math.abs(a-t)/t>=0.28;
}
function nextSetAfter(s,e,set){
  const ei=s.exercises.indexOf(e),si=e.sets.indexOf(set);
  if(si<e.sets.length-1)return {exercise:e,set:e.sets[si+1]};
  for(let i=ei+1;i<s.exercises.length;i++){const x=s.exercises[i];if(x.status!=='skipped'&&x.status!=='completed'&&x.sets.some(z=>!z.done))return {exercise:x,set:x.sets.find(z=>!z.done)};}
  for(let i=0;i<s.exercises.length;i++){const x=s.exercises[i];if(x.status==='deferred'&&x.sets.some(z=>!z.done))return {exercise:x,set:x.sets.find(z=>!z.done)};}
  return null;
}
function nextPendingExercise(s,afterId=null){
  const start=afterId?Math.max(0,s.exercises.findIndex(e=>e.exerciseId===afterId)+1):0;
  const ordered=[...s.exercises.slice(start),...s.exercises.slice(0,start)];
  return ordered.find(e=>e.status!=='completed'&&e.status!=='skipped'&&e.status!=='deferred') || ordered.find(e=>e.status==='deferred') || null;
}
function advanceAfterStatus(s,e){const n=nextPendingExercise(s,e.exerciseId);state.ui.expandedExerciseId=n?.exerciseId||null;}

function startRest(s,e,set){
  restFinishedSignalFor=null;
  state.restTimer={sessionId:s.id,exerciseId:e.exerciseId,setId:set.id,startedAt:now(),targetSec:Number(set.targetRest||e.rest||0),pausedAt:null,totalPausedMs:0};
  set.restStartedAt=state.restTimer.startedAt;persist(true);ensureRestTicker();
}
function stopRest(source='manual',silent=false){
  const r=state.restTimer;if(!r)return;
  const s=getSession(r.sessionId);const e=s?.exercises.find(x=>x.exerciseId===r.exerciseId);const set=e?.sets.find(x=>x.id===r.setId);
  const end=now(); const pausedMs=(r.totalPausedMs||0)+(r.pausedAt?Math.max(0,end-r.pausedAt):0); if(set){set.restEndedAt=end;set.restEndSource=source;set.restPausedMs=pausedMs;}
  state.restTimer=null;restFinishedSignalFor=null;persist(true);renderRestDock();if(!silent)haptic(18);
}
function pauseRest(){const r=state.restTimer;if(!r)return;if(r.pausedAt){r.totalPausedMs+=now()-r.pausedAt;r.pausedAt=null;}else r.pausedAt=now();persist(true);renderRestDock();}
function restElapsedMs(r){const end=r.pausedAt||now();return Math.max(0,end-r.startedAt-(r.totalPausedMs||0));}
function ensureRestTicker(){clearInterval(restInterval);restInterval=setInterval(()=>{if(!state.restTimer){clearInterval(restInterval);return;}renderRestDock(true);checkRestFinished();},500);}
let restFinishedSignalFor=null;
function checkRestFinished(){const r=state.restTimer;if(!r)return;const elapsed=restElapsedMs(r)/1000;if(elapsed>=r.targetSec&&restFinishedSignalFor!==r.setId){restFinishedSignalFor=r.setId;haptic([80,60,120]);playSound('rest');}}
function renderRestDock(light=false){
  const dock=document.getElementById('rest-dock');if(!dock)return;
  const r=state.restTimer;if(!r || currentSessionId!==r.sessionId){dock.classList.add('hidden');dock.innerHTML='';return;}
  const s=getSession(r.sessionId),e=s?.exercises.find(x=>x.exerciseId===r.exerciseId),set=e?.sets.find(x=>x.id===r.setId);if(!s||!e||!set){state.restTimer=null;persist(true);dock.classList.add('hidden');return;}
  const elapsed=restElapsedMs(r)/1000;const remaining=r.targetSec-elapsed;const over=remaining<0;const pct=r.targetSec?clamp((r.targetSec-elapsed)/r.targetSec*100,0,100):0;
  const nxt=nextSetAfter(s,e,set);
  const nextText=nxt?`${nxt.exercise.name} · ${nxt.set.type==='warmup'?'Aquec.':'Série'} ${nxt.set.index}`:'Treino concluído';
  dock.classList.remove('hidden');dock.classList.toggle('rest-complete',over);
  dock.innerHTML=`<div class="rest-top"><div><div class="tiny muted">Descanso</div><div class="rest-time ${over?'over':''}">${over?'+'+secondsToClock(Math.abs(remaining)):secondsToClock(remaining)}</div></div><div style="min-width:0;text-align:right"><div class="rest-next">A seguir → ${esc(nextText)}</div><div class="rest-controls"><button class="ghost" id="rest-pause">${r.pausedAt?'Continuar':'Pausa'}</button><button class="secondary" id="rest-end">Terminar descanso</button></div></div></div><div class="rest-bar"><span style="width:${pct}%"></span></div>`;
  dock.querySelector('#rest-pause').onclick=pauseRest;dock.querySelector('#rest-end').onclick=()=>stopRest('manual');
}

function openSetNoteModal(s,setId){
  const e=exerciseBySet(s,setId),set=e?.sets.find(x=>x.id===setId);if(!set)return;
  modal(`<button class="modal-close" data-close>×</button><h3>Observação da série</h3><textarea id="set-note-text" class="textarea" placeholder="Ex.: quase cãibra, execução piorou…">${esc(set.note||'')}</textarea><div class="modal-actions"><button class="secondary" data-close>Fechar</button></div>`,root=>{

function openFinishModal(s){

  const msg=unresolved.length?`Ainda tens ${unresolved.length} exercício(s) pendente(s). Se terminares agora, a sessão fica registada com esses exercícios por fazer.`:'Todas as séries planeadas estão concluídas.';
  const anyDone=s.exercises.some(e=>e.sets.some(x=>x.done));

    root.querySelector('#session-note').addEventListener('input',ev=>{s.sessionNote=ev.target.value;persist();});

    const del=root.querySelector('#delete-active');if(del)del.onclick=()=>openConfirm('Eliminar sessão','Esta sessão ainda não tem séries concluídas e será removida completamente.',()=>{state.sessions=state.sessions.filter(x=>x.id!==s.id);if(state.activeSessionId===s.id)state.activeSessionId=null;if(currentSessionId===s.id)currentSessionId=null;if(state.restTimer?.sessionId===s.id)state.restTimer=null;persist(true);closeModal();render();});
  });

function finishSession(s){
  s.endedAt=now();
  const unresolved=s.exercises.filter(e=>e.status!=='completed'&&e.status!=='skipped');
  if(unresolved.length){unresolved.forEach(e=>{if(e.status==='pending'||e.status==='deferred')e.status='not_done';});s.status='incomplete';}
  else s.status='completed';
  state.activeSessionId=null;currentSessionId=null;state.restTimer=null;state.ui.expandedExerciseId=null;persist(true);releaseWakeLock();closeModal();playSound('finish');haptic([35,45,90,55,140]);motionCue={type:'finish'};render();openSummary(s);
}
function openSummary(s){
  const stats=sessionStats(s);const skipped=s.exercises.filter(e=>e.status==='skipped').length;
  modal(`<h3>Treino guardado</h3><div class="grid-2"><div class="stat"><div class="label">Duração</div><div class="value">${formatDuration((s.endedAt||now())-(s.startedAt||now()))}</div></div><div class="stat"><div class="label">Volume</div><div class="value">${Math.round(stats.volume).toLocaleString('pt-PT')}</div></div><div class="stat"><div class="label">Séries de trabalho</div><div class="value">${stats.workSets}</div></div><div class="stat"><div class="label">Saltados</div><div class="value">${skipped}</div></div></div><div class="modal-actions"><button id="copy-report" class="primary">Copiar relatório para ChatGPT</button><button class="secondary" data-close>Fechar</button></div>`,root=>{

  });

function openCloseOldModal(s){
  modal(`<h3>Treino por terminar</h3><p class="small muted">Podes continuar ou encerrá-lo como incompleto sem perder o que já fizeste.</p><div class="modal-actions"><button class="secondary" data-close>Cancelar</button><button class="danger" id="close-incomplete">Encerrar como incompleto</button></div>`,root=>{root.querySelector('#close-incomplete').onclick=()=>{s.status='incomplete';s.endedAt=now();if(state.activeSessionId===s.id)state.activeSessionId=null;if(currentSessionId===s.id)currentSessionId=null;if(state.restTimer?.sessionId===s.id)state.restTimer=null;persist(true);closeModal();render();};});

function renderHistory(){
  const root=document.getElementById('main-content');const ym=state.settings.calendarMonth||isoDate().slice(0,7);const selected=state.ui.selectedHistoryDate||isoDate();
  root.innerHTML=`<div class="calendar">${calendarHTML(ym,selected)}</div><div class="btn-row" style="margin-top:10px"><button class="secondary" id="mark-absence">Marcar ausência planeada</button></div><h3 class="section-title">${fmtDate(selected)}</h3><div id="history-day">${historyDayHTML(selected)}</div>`;
  root.querySelector('#cal-prev').onclick=()=>{state.settings.calendarMonth=shiftMonth(ym,-1);persist();render();};
  root.querySelector('#cal-next').onclick=()=>{state.settings.calendarMonth=shiftMonth(ym,1);persist();render();};

function calendarHTML(ym,selected){

function extractJSONObject(text){
  const src=String(text||'').trim();
  if(!src)return null;
  const direct=safeJSON(src);if(direct&&typeof direct==='object'&&!Array.isArray(direct))return direct;
  const unfenced=src.replace(/```(?:json)?/gi,'').replace(/```/g,'').trim();
  const clean=safeJSON(unfenced);if(clean&&typeof clean==='object'&&!Array.isArray(clean))return clean;
  for(let start=0;start<unfenced.length;start++){
    if(unfenced[start]!=='{')continue;
    let depth=0,inString=false,escaped=false;
    for(let i=start;i<unfenced.length;i++){
      const ch=unfenced[i];
      if(inString){if(escaped){escaped=false;continue;}if(ch==='\\'){escaped=true;continue;}if(ch==='"')inString=false;continue;}
      if(ch==='"'){inString=true;continue;}
      if(ch==='{')depth++;
      else if(ch==='}'){depth--;if(depth===0){const obj=safeJSON(unfenced.slice(start,i+1));if(obj&&typeof obj==='object'&&!Array.isArray(obj))return obj;break;}}
    }
  }
  return null;
}
function parsePatch(text){
  const obj=extractJSONObject(text);
  if(!obj)return {patch:null,error:'Não encontrei um JSON válido no texto colado.'};
  if(obj.type!=='hipertrofia-pro-patch')return {patch:null,error:'Este JSON não é um patch Hipertrofia Pro.'};
  if(obj.schema!==undefined&&Number(obj.schema)!==PATCH_SCHEMA)return {patch:null,error:`Schema do patch incompatível. Esperado: ${PATCH_SCHEMA}.`};
  if(!Array.isArray(obj.changes))return {patch:null,error:'O patch não contém a lista changes.'};
  return {patch:obj,error:''};
}
const PATCH_OPS=new Set(['update','pause','resume','add','remove','reorder','musclemap','day']);
const PATCH_EX_FIELDS=new Set(['name','active','sets','targetWeight','targetReps','rest','loadMode','warmup','execution','progression','notes','unilateral','muscleMap']);
const PATCH_DAY_FIELDS=new Set(['title','focus']);
const LOAD_MODES=new Set(['total','perSide','twoDumbbells','singleDumbbell','bodyweight','custom']);
function plainObject(v){return !!v&&typeof v==='object'&&!Array.isArray(v);}
function sanitizeExerciseSet(set){
  const out={};if(!plainObject(set))return out;
  for(const [k,v] of Object.entries(set)){
    if(!PATCH_EX_FIELDS.has(k))continue;
    if(k==='sets'){const n=Math.round(Number(v));if(Number.isFinite(n)&&n>=1&&n<=20)out[k]=n;continue;}
    if(k==='rest'){const n=Math.round(Number(v));if(Number.isFinite(n)&&n>=0&&n<=1800)out[k]=n;continue;}
    if(k==='active'||k==='unilateral'){out[k]=!!v;continue;}
    if(k==='loadMode'){if(LOAD_MODES.has(String(v)))out[k]=String(v);continue;}
    if(k==='warmup'){
      if(plainObject(v)){const w={sets:clamp(Math.round(Number(v.sets)||0),0,10),weight:String(v.weight??''),reps:String(v.reps??'')};out[k]=w;}continue;
    }
    if(k==='muscleMap'){const mm=normalizeMuscleMap(v);if(mm)out[k]=mm;continue;}
    out[k]=String(v??'').slice(0,k==='execution'||k==='progression'||k==='notes'?4000:300);
  }

}
function normalizeNewExercise(raw){
  if(!plainObject(raw))return null;
  const id=String(raw.id||'').trim();const name=String(raw.name||'').trim();
  if(!/^[a-z0-9][a-z0-9._-]{2,79}$/i.test(id)||!name)return null;
  const e=ex(id,name.slice(0,160),clamp(Math.round(Number(raw.sets)||3),1,20),String(raw.targetWeight??''),String(raw.targetReps??'8–12'),clamp(Math.round(Number(raw.rest)||90),0,1800),LOAD_MODES.has(String(raw.loadMode))?String(raw.loadMode):'total',plainObject(raw.warmup)?{sets:clamp(Math.round(Number(raw.warmup.sets)||0),0,10),weight:String(raw.warmup.weight??''),reps:String(raw.warmup.reps??'')}:{sets:0,weight:'',reps:''},String(raw.execution??'').slice(0,4000),String(raw.progression??'').slice(0,4000),String(raw.notes??'').slice(0,4000));

function applyPatch(patch,validation=validatePatch(patch)){

      else if(c.op==='resume'){day.exercises.find(x=>x.id===c.id).active=true;}
      else if(c.op==='add'){day.exercises.push(deepClone(c.exercise));}

    state.planHistory.unshift({id:uid('ph'),at:now(),source:'patch',label:String(patch.label||'Patch ChatGPT').slice(0,220),changes:deepClone(validation.normalized)});

document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&activeSession())requestWakeLock();});

let hpRuntimeErrorShown=false;
window.addEventListener('error',ev=>{console.error('Hipertrofia Pro runtime:',ev.error||ev.message);if(activeSession()&&!hpRuntimeErrorShown){hpRuntimeErrorShown=true;toast('Uma componente visual falhou, mas o treino continua disponível.');}});
window.addEventListener('unhandledrejection',ev=>{console.error('Hipertrofia Pro promise:',ev.reason);});

function setupNav(){document.querySelectorAll('.nav-item').forEach(b=>b.onclick=()=>{if(state.settings.view===b.dataset.view)return;state.settings.view=b.dataset.view;persist();haptic(7);motionRender();});window.addEventListener('resize',()=>requestAnimationFrame(syncNavGlider));}
function setupGlobal(){
  document.addEventListener('pointerdown',ev=>{const b=ev.target.closest?.('button');if(!b)return;b.classList.add('hp-pressed');setTimeout(()=>b.classList.remove('hp-pressed'),220);},{passive:true});
  document.getElementById('import-file').addEventListener('change',e=>{const f=e.target.files?.[0];if(f)handleImportFile(f);e.target.value='';});
  window.addEventListener('beforeunload',()=>persist(true));
  window.addEventListener('pagehide',()=>persist(true));
  if(!nativeAvailable()&&'serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
  try{navigator.storage?.persist?.();}catch{}
  ensureRestTicker();recoverIndexedDBIfNewer();
}
window.onNativePause=()=>{persist(true);releaseWakeLock();};
window.onNativeResume=()=>{ensureRestTicker();renderRestDock(true);checkRestFinished();if(activeSession())requestWakeLock();};
window.handleAndroidBack=()=>{
  if(document.getElementById('modal-root')?.children.length){closeModal();return true;}
  if(state.settings.view!=='workout'){state.settings.view='workout';persist(true);motionRender();return true;}
  if(currentSessionId&&!state.ui.sessionOverview){state.ui.sessionOverview=true;persist(true);motionRender();return true;}
  if(currentSessionId){currentSessionId=null;state.ui.sessionOverview=false;render();return true;}
  return false;
};
function localPreviewGate(){
  if(config.googleCloudConfigured||state.ui.localPreviewAccepted)return;
  modal(`<h3>Modo local</h3><p class="small muted">A conta Google obrigatória e a sincronização cloud continuam pendentes porque exigem credenciais externas do projecto. Até essas credenciais serem configuradas, os dados ficam protegidos localmente com autosave e backups.</p><div class="modal-actions"><button id="accept-local" class="primary">Continuar em modo local</button></div>`,root=>{root.querySelector('#accept-local').onclick=()=>{state.ui.localPreviewAccepted=true;persist(true);closeModal();};});
}

setupNav();setupGlobal();render();localPreviewGate();
if(activeSession())requestWakeLock();

})();

</script>
</body>
</html>
